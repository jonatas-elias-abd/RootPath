<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 70" width="290" height="70" fill="none">
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Cubo isométrico de camadas de sistema (Hardware, Kernel, Root, Shell) -->
  <g transform="translate(12, 10)">
    <!-- Face Superior (Shell / Prompt) -->
    <polygon points="28,4 48,14 28,24 8,14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M22 13 L26 15 L22 17" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="29" y1="17" x2="34" y2="17" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Face Esquerda (Filesystem / Camada POSIX) -->
    <polygon points="8,17 26,26 26,48 8,39" fill="#172554" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="14" y1="28" x2="20" y2="31" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="35" x2="22" y2="39" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Face Direita (Memória / Sandboxing) -->
    <polygon points="30,26 48,17 48,39 30,48" fill="#0b1329" stroke="#10b981" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Ponto central flutuante de elevação de privilégios -->
    <circle cx="39" cy="33" r="2.5" fill="#10b981"/>
    <circle cx="39" cy="33" r="5" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- Tipografia -->
  <text x="76" y="38" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.03em">Root<tspan fill="#38bdf8">Path</tspan></text>
  <text x="77" y="52" fill="#38bdf8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="9" letter-spacing="0.18em">SANDBOX // ENV</text>
</svg>
